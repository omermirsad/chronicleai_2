name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same workflow and PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Code Quality & Linting
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          SUPABASE_CLI_NO_DOWNLOAD: true

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Check for console logs in production code
        run: |
          if grep -r "console\.log" src --exclude-dir=__tests__ --exclude="*.test.*"; then
            echo "❌ Found console.log in production code"
            exit 1
          fi
          echo "✅ No console.log found in production code"

  # Job 2: Type Checking
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          SUPABASE_CLI_NO_DOWNLOAD: true

      - name: Run type check
        run: npm run type-check

  # Job 3: Unit & Integration Tests
  test:
    name: Test (Unit & Integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          SUPABASE_CLI_NO_DOWNLOAD: true

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          # This will be enforced by vitest config

  # Job 4: Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          SUPABASE_CLI_NO_DOWNLOAD: true

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: npx audit-ci --moderate

  # Job 5: Build
  build:
    name: Build Production Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          SUPABASE_CLI_NO_DOWNLOAD: true

      - name: Build production bundle
        run: npm run build:prod
        env:
          # Use dummy values for build
          VITE_SUPABASE_URL: https://dummy.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy_key_for_build
          VITE_APP_URL: https://chronicle-ai.app

      - name: Check bundle size
        run: |
          echo "Checking bundle sizes..."
          du -sh dist/
          find dist/assets/js -name "*.js" -exec du -h {} \; | sort -rh | head -10

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-production
          path: dist/
          retention-days: 7

      - name: Analyze bundle
        run: npm run analyze:bundle
        continue-on-error: true

  # Job 6: Lighthouse CI (Performance)
  lighthouse:
    name: Lighthouse Performance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          SUPABASE_CLI_NO_DOWNLOAD: true

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-production
          path: dist/

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun --collect.startServerCommand="npx serve dist -p 8080" --collect.url=http://localhost:8080
        continue-on-error: true

  # Job 7: Dependency Review (PRs only)
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  # Job 8: Bundle Size Check
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-production
          path: dist/

      - name: Check bundle size limits
        run: |
          echo "Checking main bundle size..."
          MAIN_BUNDLE_SIZE=$(find dist/assets/js -name "index-*.js" -exec du -k {} \; | cut -f1)
          echo "Main bundle size: ${MAIN_BUNDLE_SIZE}KB"

          # Enforce bundle size budget (500KB for main bundle)
          if [ "$MAIN_BUNDLE_SIZE" -gt 500 ]; then
            echo "❌ Main bundle exceeds 500KB limit!"
            exit 1
          fi
          echo "✅ Bundle size within limits"

  # All checks passed
  all-checks-passed:
    name: All Checks Passed ✅
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security, build, bundle-size]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All checks passed!"
